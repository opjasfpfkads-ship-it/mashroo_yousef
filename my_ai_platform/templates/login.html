<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Nexus Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Readex Pro', sans-serif; }
        body {
            background-color: #030712;
            background-image: 
                radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(217, 70, 239, 0.2) 0px, transparent 50%);
        }
        .glass-box {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-100">

    <div class="glass-box p-8 rounded-3xl w-full max-w-md space-y-6 shadow-2xl relative overflow-hidden">
        
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-500 to-fuchsia-600 flex items-center justify-center font-bold text-white shadow-lg mx-auto text-xl">
                N
            </div>
            <h2 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-400">
                Nexus Studio Pro
            </h2>
            <p class="text-xs text-gray-400">مرحباً بك! سجل دخولك أو أنشئ حساباً جديداً للبدء</p>
        </div>

        {% if error %}
        <div class="p-3 bg-red-500/10 border border-red-500/30 text-red-400 text-xs rounded-xl text-center font-medium">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1.5">اسم المستخدم</label>
                <input type="text" name="username" required class="w-full p-3 bg-gray-950/80 border border-gray-800 rounded-xl text-xs text-gray-200 focus:border-cyan-500 outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1.5">كلمة المرور</label>
                <input type="password" name="password" required class="w-full p-3 bg-gray-950/80 border border-gray-800 rounded-xl text-xs text-gray-200 focus:border-cyan-500 outline-none transition">
            </div>

            <div id="confirmPassBox" class="hidden">
                <label class="block text-xs font-medium text-gray-300 mb-1.5">تأكيد كلمة المرور</label>
                <input type="password" name="confirm_password" class="w-full p-3 bg-gray-950/80 border border-gray-800 rounded-xl text-xs text-gray-200 focus:border-cyan-500 outline-none transition">
            </div>

            <input type="hidden" name="action" id="authAction" value="login">

            <button type="submit" id="submitBtn" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 font-bold rounded-xl text-xs hover:opacity-95 transition shadow-lg shadow-cyan-500/25">
                دخول لحسابي 🚀
            </button>
        </form>

        <div class="text-center pt-2 border-t border-gray-800/60">
            <button onclick="toggleAuth()" id="toggleBtn" class="text-xs text-cyan-400 font-semibold hover:underline">
                ليس لديك حساب؟ إنشاء حساب جديد
            </button>
        </div>
    </div>

    <script>
        let isLogin = true;
        function toggleAuth() {
            isLogin = !isLogin;
            document.getElementById('confirmPassBox').classList.toggle('hidden');
            document.getElementById('authAction').value = isLogin ? 'login' : 'register';
            document.getElementById('submitBtn').innerText = isLogin ? 'دخول لحسابي 🚀' : 'إنشاء الحساب الآن ✨';
            document.getElementById('toggleBtn').innerText = isLogin ? 'ليس لديك حساب؟ إنشاء حساب جديد' : 'لديك حساب بالفعل؟ تسجيل الدخول';
        }
    </script>
</body>
</html>
